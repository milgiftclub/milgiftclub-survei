name: Cek link survei (tanpa login)
on: workflow_dispatch
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan browser
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium webkit >/dev/null
      - name: Buka link seperti responden di HP (tanpa akun Google)
        run: node scripts/cek-link.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tangkapan-layar, path: "*.png" }
