# Setiap push ke main yang mengubah apps-script/ -> kode dipasang ke Apps Script
# dan deployment yang SAMA di-update ke versi baru (link tidak berubah).
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.github/workflows/deploy-apps-script.yml']
  workflow_dispatch:

concurrency: { group: apps-script, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Pasang clasp
        run: npm install -g @google/clasp@2.4.2
      - name: Login Google
        env:
          CLASPRC_JSON: '${{ secrets.CLASPRC_JSON }}'
          KUNCI: '${{ secrets.NETLIFY_AUTH_TOKEN }}'
        run: |
          if [ -n "$CLASPRC_JSON" ]; then printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          elif [ -f apps-script/clasprc.enc ] && [ -n "$KUNCI" ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KUNCI -in apps-script/clasprc.enc -out ~/.clasprc.json
          else echo "::error::Belum login Google. Jalankan workflow 'Login Google (setup Apps Script)' dulu (lihat README)."; exit 1; fi
      - name: Deploy proyek survei
        working-directory: apps-script/survei
        run: |
          clasp push --force
          ID=$(jq -r .survei ../deployments.json)
          clasp deploy --deploymentId "$ID" --description "auto ${GITHUB_SHA::7}"
      - name: Deploy proyek dashboard
        working-directory: apps-script/dashboard
        run: |
          ID=$(jq -r .dashboard ../deployments.json)
          if [ ! -f .clasp.json ] || [ -z "$ID" ]; then echo "Dashboard belum di-setup (jalankan scripts/setup-codespace.sh). Dilewati."; exit 0; fi
          clasp push --force
          clasp deploy --deploymentId "$ID" --description "auto ${GITHUB_SHA::7}"
