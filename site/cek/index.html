<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Status Giveaway — MIL Gift Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E1; --cream2:#F6E6CC; --coral:#F2575D; --coral-d:#D9444A; --yellow:#F9C23C; --yellow-l:#FFF1C9;
    --brown:#4A2A1A; --brown2:#7A5440; --line:#EBD7B8; --white:#FFFFFF; --err:#C62828;
    --display:"Fredoka","Nunito",system-ui,sans-serif; --body:"Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --hand:"Caveat","Comic Sans MS",cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--brown);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  body{min-height:100vh;position:relative;overflow-x:hidden}
  .blob{position:fixed;z-index:0;pointer-events:none;border-radius:58% 42% 63% 37% / 45% 55% 45% 55%}
  .b1{width:230px;height:200px;background:var(--yellow);top:-90px;left:-110px;transform:rotate(-12deg)}
  .b2{width:210px;height:230px;background:var(--coral);top:-110px;right:-120px;transform:rotate(20deg);opacity:.9}
  .b3{width:240px;height:220px;background:var(--coral);bottom:-150px;right:-130px;opacity:.85}
  .b4{width:200px;height:190px;background:var(--yellow);bottom:-140px;left:-120px;transform:rotate(30deg);opacity:.9}
  header,main,nav{position:relative;z-index:1}
  header{padding:18px 16px 6px;text-align:center}
  .logo{font-family:var(--display);font-weight:700;color:var(--brown);font-size:26px;line-height:1;letter-spacing:.01em}
  .logo .dot{color:var(--coral)}
  .tag{font-size:10px;letter-spacing:.28em;color:var(--brown2);margin-top:6px;font-weight:700}
  .bar{max-width:520px;margin:14px auto 0;height:10px;background:var(--white);border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--coral));border-radius:8px;transition:width .3s}
  main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
  .section{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--coral);text-transform:uppercase;margin-bottom:6px}
  .catpill{display:inline-block;background:var(--yellow);color:var(--brown);font-size:13px;font-weight:800;padding:5px 14px;border-radius:999px;margin-bottom:10px;transform:rotate(-1.5deg);box-shadow:2px 2px 0 var(--brown)}
  h1{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.3;margin:0 0 8px;color:var(--brown)}
  .intro{font-size:15px;color:var(--brown2);margin:0 0 14px;background:var(--white);border-radius:16px;padding:14px 16px;border:2px dashed var(--line)}
  .hint{font-size:14px;font-weight:700;color:var(--coral-d);margin:0 0 12px;line-height:1.4}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opts.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts.two .opt{padding:11px 12px;gap:9px;font-size:14.5px;min-height:0;align-items:center}
  .opts.two .other,.opts.two .grp,.opts.two .opt.wide{grid-column:1/-1}
  .opts.two .other{margin-left:0}
  @media (max-width:340px){.opts.two{grid-template-columns:1fr}}
  .opt{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;user-select:none;min-height:50px;font-weight:600;transition:transform .08s,border-color .15s,background .15s}
  .opt:active{transform:scale(.99)}
  .opt input{margin:2px 0 0;accent-color:var(--coral);width:20px;height:20px;flex:none}
  .opt.on{border-color:var(--coral);background:var(--yellow-l);box-shadow:3px 3px 0 var(--coral)}
  .opt.dis{opacity:.45;cursor:not-allowed}
  .opt small{font-weight:600}
  .grp{font-family:var(--display);font-size:14px;font-weight:600;color:var(--coral-d);margin:14px 0 2px}
  .other{margin:4px 0 0 32px}
  input[type=text],input[type=tel],select,textarea{width:100%;font:inherit;font-weight:600;padding:13px 15px;border:2px solid var(--line);border-radius:16px;background:var(--white);color:var(--brown);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--coral);box-shadow:0 0 0 3px rgba(242,87,93,.15)}
  textarea{min-height:110px;resize:vertical}
  .mrow{background:var(--white);border:2px solid var(--line);border-radius:16px;padding:13px;margin-bottom:10px}
  .mrow.miss{border-color:var(--err)}
  .mrow .lbl{font-weight:800;font-size:15px;margin-bottom:9px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;background:var(--cream);user-select:none;color:var(--brown)}
  .chip.on{background:var(--coral);border-color:var(--coral);color:var(--white)}
  .nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .nps button{font-family:var(--display);font-size:16px;font-weight:600;padding:12px 0;border:2px solid var(--line);border-radius:12px;background:var(--white);cursor:pointer;color:var(--brown)}
  .nps button.on{background:var(--coral);color:var(--white);border-color:var(--coral)}
  .npsl{display:flex;justify-content:space-between;font-size:12px;color:var(--brown2);margin-top:6px;font-weight:600}
  .wait{display:none;align-items:center;gap:12px;margin-top:12px;padding:14px 16px;border-radius:14px;background:#EEF6FF;color:#1F3B73;font-size:14px;font-weight:700;line-height:1.45}
  .wait.on{display:flex}
  .wait i{flex:0 0 20px;width:20px;height:20px;border:3px solid #BFD6F6;border-top-color:#2F6FD6;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{color:var(--err);font-size:14px;font-weight:700;margin-top:12px;min-height:20px}
  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,241,225,.94);backdrop-filter:blur(6px);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
  nav div{max-width:560px;margin:0 auto;display:flex;gap:10px}
  nav button{font-family:var(--display);font-size:17px;font-weight:600;border-radius:999px;padding:13px;cursor:pointer;border:0}
  #back{background:var(--white);color:var(--brown);border:2px solid var(--brown);flex:0 0 110px}
  #next{background:var(--coral);color:var(--white);flex:1;box-shadow:0 4px 0 var(--coral-d)}
  #next:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-d)}
  #next[disabled]{opacity:.6;cursor:wait}
  .end{text-align:center;padding-top:30px}
  .end .big{font-size:56px}
  .end .note{margin-top:14px;background:var(--yellow-l);border:2px solid var(--yellow);border-radius:16px;padding:12px 16px;font-weight:800;font-size:15px;color:var(--brown);line-height:1.4}
  .end .note:before{content:'✨ '}
  .end .ctas{margin-top:16px}
  .end .cta2{background:var(--white)!important;color:var(--coral-d)!important;border:2px solid var(--coral);box-shadow:none!important}
  .end .cta{display:block;margin:12px 0 0;background:var(--coral);color:#fff;text-decoration:none;font-weight:800;font-size:16px;border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--coral-d)}
  .ver{font-size:11px;color:var(--brown2);opacity:.6;text-align:center;margin-top:18px}
  .skbox{margin:14px 0 4px;border:2px solid var(--line);border-radius:18px;background:var(--white);overflow:hidden}
  .skh{font-family:var(--display);font-weight:700;font-size:16px;color:var(--brown);padding:12px 16px;border-bottom:2px dashed var(--line);background:var(--cream)}
  .skc{max-height:260px;overflow-y:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
  .skf{font-size:12.5px;color:var(--brown2);padding:10px 16px;border-top:2px dashed var(--line);background:var(--cream);line-height:1.45}
  .sk{color:var(--brown);font-size:14.5px;line-height:1.6} .skbox .sk{border:0;padding:0;margin:0;background:none}
  .sk h2{font-family:var(--display);font-size:16.5px;margin:14px 0 6px;color:var(--brown)}
  .sk ol,.sk ul{margin:4px 0 8px;padding-left:22px} .sk li{margin:4px 0} .sk p{margin:6px 0} .sk a{color:var(--coral-d);font-weight:800}
  .warn{background:#FDECEC;border:2px solid #F3B9B9;border-radius:16px;padding:12px 14px;margin:12px 0;color:#7A2323;font-size:14px;line-height:1.55}
  .links{font-size:14px;margin:10px 0 0;font-weight:700}
  .promo{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:0 0 16px;font-size:14.5px;color:var(--brown2)}
  .promo .pr-l{display:inline-block;background:var(--yellow-l);color:var(--brown);font-weight:800;font-size:12.5px;border-radius:20px;padding:4px 10px;margin-bottom:8px}
  .promo .pr-u{display:flex;flex-direction:column;margin-bottom:8px}
  .promo .pr-u span{font-weight:700;font-size:13px}
  .promo .pr-u b{font-family:var(--display);font-size:22px;color:var(--coral-d);line-height:1.2}
  .pr-s{font-weight:800;color:var(--brown);margin:2px 0 4px}
  .steps{text-align:left;background:var(--white);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0 0;font-size:15px;color:var(--brown)}
  .steps ol{margin:4px 0 0;padding-left:22px}
  .steps li{margin:6px 0}
  .steps li.ok{color:var(--brown2)}
  .promo ul{margin:0 0 10px;padding-left:20px}
  .promo li{margin:2px 0;font-weight:700;color:var(--brown)}
  .promo .pr-r{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding:7px 0}
  .promo .pr-r span{white-space:nowrap}
  .promo .pr-r b{color:var(--brown);text-align:right}
  .promo .pr-f{font-size:12.5px;opacity:.8;margin-top:4px}
  .links a{color:var(--coral-d)}
  @media (max-width:380px){.nps{grid-template-columns:repeat(6,1fr)} h1{font-size:20px}}
</style>
<style>
  .ck{background:var(--white);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
  .ck h2{font-family:var(--display);font-size:18px;margin:0 0 10px;color:var(--brown)}
  .it{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)} .it:first-of-type{border-top:0}
  .ic{font-size:20px;line-height:1.2;flex:none;width:26px;text-align:center}
  .it b{display:block;color:var(--brown)} .it p{margin:2px 0 0;color:var(--brown2);font-size:14px;line-height:1.45}
  .verdict{border-radius:18px;padding:16px;margin-top:14px;font-weight:800;line-height:1.45}
  .verdict.ok{background:#E7F5EC;color:#22663F;border:2px solid #9fd6b3} .verdict.no{background:var(--yellow-l);color:var(--brown);border:2px solid var(--yellow)}
  .row2{display:flex;gap:8px;margin-top:10px} .row2 input{flex:1} .row2 button{flex:none;font:inherit;font-weight:800;border:0;border-radius:16px;padding:0 20px;background:var(--coral);color:#fff;cursor:pointer}
  .kp{display:inline-block;background:#E7F5EC;color:#22663F;border-radius:999px;padding:0 8px;font-size:12px;font-weight:800}
  .kupon{display:flex;gap:14px;align-items:center;background:var(--yellow-l);border:2px solid var(--yellow);border-radius:18px;padding:14px 16px;margin-top:14px;color:var(--brown)}
  .kupon .kn{font-family:var(--display);font-size:30px;font-weight:700;flex:none} .kupon p{margin:2px 0 0;font-size:14px;color:var(--brown2);line-height:1.45}
  .more{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-top:8px;border-radius:14px;background:var(--cream);border:2px solid var(--line);text-decoration:none;color:var(--brown);font-weight:700}
  .more b{color:var(--coral-d);flex:none;font-size:13.5px}
  .small{font-size:12.5px;color:var(--brown2);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<header>
  <div class="logo">MIL Gift Club<span class="dot">.</span></div>
  <div class="tag">INSIGHT · COMMUNITY · REWARDS</div>
</header>
<main>
  <div class="section">Giveaway</div>
  <h1>Cek status keikutsertaan kamu</h1>
  <p class="intro" id="per">Masukkan username Instagram yang kamu pakai saat mengisi survei untuk melihat syarat mana yang sudah dan belum dipenuhi.</p>
  <div class="row2"><input type="text" id="ig" placeholder="@usernamekamu" autocomplete="off"><button id="go" type="button">Cek</button></div>
  <div class="err" id="err"></div>
  <div id="out"></div>
</main>
<script src="../config.js"></script>
<script>
(function () {
  var C = window.SURVEI_CONFIG || {}, T = C.TAMPILAN || {}, API = String(C.API_V1 || '').trim();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
  var IGH = T.IG_HANDLE || '@milgiftclub';
  function api(fn, args) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) }).then(function (r) { return r.text(); })
      .then(function (t) { var j = JSON.parse(t); if (!j.ok) throw new Error(j.error || 'gagal'); return j.data; });
  }
  function item(ic, title, text) { return '<div class="it"><div class="ic">' + ic + '</div><div><b>' + title + '</b>' + (text ? '<p>' + text + '</p>' : '') + '</div></div>'; }
  function cek() {
    var v = $('ig').value.trim(); $('err').textContent = '';
    if (!/^@?[A-Za-z0-9._]{1,30}$/.test(v)) { $('err').textContent = 'Tulis username Instagram yang benar, mis. @namakamu'; return; }
    $('go').disabled = true; $('go').textContent = '…';
    $('out').innerHTML = '<div class="wait on"><i></i><span>Tunggu sesaat, kami sedang mengecek data kamu…</span></div>';
    api('giveawayStatus', [v]).then(function (d) {
      $('go').disabled = false; $('go').textContent = 'Cek';
      if (!d.ok) { $('out').innerHTML = ''; $('err').textContent = d.msg || 'Gagal mengecek'; return; }
      var h = '<div class="ck"><h2>Syarat giveaway ' + esc(d.ig) + '</h2>', kurang = [];
      // 1. survei
      if (d.blocked) { h += item('⛔', 'Akun sedang ' + (d.blocked.state === 'suspend' ? 'disuspend' : 'diblokir'), 'Karena riwayat jawaban asal-asalan' + (d.blocked.until ? ', sampai ' + esc(d.blocked.until) : '') + '. Hubungi ' + esc(d.blocked.email) + ' untuk membuka akses.'); kurang.push('akses akun'); }
      if (!d.surveys.length) { h += item('❌', 'Isi survei', 'Belum ada survei yang terisi dengan username ini. Pastikan username sama persis dengan yang kamu tulis di survei.'); kurang.push('isi survei'); }
      else {
        var sv = d.surveys.map(function (x) { return (x.valid ? '✅ ' : '❌ ') + esc(x.name) + (x.kupon ? ' <span class="kp">+' + (x.nilai || 1) + ' kupon</span>' : '') + (x.reason ? ' — ' + esc(x.reason) : ''); }).join('<br>');
        h += item(d.surveyOk ? '✅' : '❌', 'Isi survei', sv); if (!d.surveyOk && !d.blocked) kurang.push('survei yang valid');
      }
      // 2. komentar + tag
      var k = d.komentar, post = d.posts && d.posts[0] ? ' di <a href="' + esc(d.posts[0]) + '" target="_blank" rel="noopener">postingan giveaway</a>' : ' di postingan giveaway';
      if (k.state === 'ok') h += item('✅', 'Komentar & tag ' + k.min + ' teman', 'Ditemukan komentar kamu dengan ' + k.n + ' teman berbeda di-tag.');
      else if (k.state === 'kurang') { h += item('❌', 'Komentar & tag ' + k.min + ' teman', 'Komentar kamu baru men-tag ' + k.n + ' teman. Tambahkan komentar dan tag ' + (k.min - k.n) + ' teman lagi' + post + '.'); kurang.push('tag teman'); }
      else if (k.state === 'belum') { h += item('❌', 'Komentar & tag ' + k.min + ' teman', 'Belum ada komentar dari akun ini' + post + '. Komentar dicek berkala, jadi kalau baru saja berkomentar, cek lagi sekitar 1 jam lagi.'); kurang.push('komentar & tag teman'); }
      else h += item('⏳', 'Komentar & tag ' + (k.min || 3) + ' teman', 'Tulis komentar dan tag ' + (k.min || 3) + ' teman berbeda' + post + '. Dicek saat undian.');
      // 3. syarat yang dicek manual
      h += item('⏳', 'Follow Instagram ' + esc(IGH) + ', like & share ke Story', 'Instagram tidak mengizinkan kami membaca ini secara otomatis, jadi dicek manual saat pemenang diundi. Pastikan akun kamu tidak private supaya bisa kami cek.');
      h += '</div>';
      h += d.eligible ? '<div class="verdict ok">🎉 Semua syarat yang bisa kami cek sudah terpenuhi. Pastikan juga sudah follow, like & share ke Story ya!</div>'
        : '<div class="verdict no">Masih ada yang kurang: ' + esc(kurang.join(', ') || 'syarat di atas') + '. Lengkapi dulu supaya bisa ikut diundi.</div>';
      // kupon & survei lain
      var per = esc(d.periodeAktif || 'periode ini');
      h += '<div class="kupon"><div class="kn">🎟️ ' + (d.kupon || 0) + '</div><div><b>Kupon undian kamu di ' + per + '</b><p>Setiap survei valid bernilai 1–3 kupon sesuai panjang survei. Makin banyak kupon, makin besar peluang menang, dan kupon bisa ditukar hadiah di halaman depan.</p></div></div>';
      if (d.surveiLain && d.surveiLain.length) {
        h += '<div class="ck"><h2>Tambah kupon: isi survei lainnya</h2>' + d.surveiLain.map(function (x) {
          var u = String(x.link || ''); u += (u.indexOf('?') < 0 ? '?' : '&') + 'src=cek';
          return '<a class="more" href="' + esc(u) + '" target="_blank" rel="noopener"><span>' + esc(x.name) + '</span><b>' + (x.kupon === false ? 'Isi ulang (ronde baru) →' : 'Isi survei · +' + (x.nilai || 1) + ' kupon →') + '</b></a>';
        }).join('') + '</div>';
      } else if (d.surveys.length) h += '<p class="small">Kamu sudah mengisi semua survei yang sedang dibuka. Pantau Instagram ' + esc(IGH) + ' untuk survei berikutnya.</p>';
      if (d.periode) h += '<p class="small">' + esc(d.periode) + '. Status diperbarui berkala; hasil akhir ditentukan saat verifikasi pemenang.</p>';
      $('out').innerHTML = h;
    }, function () { $('go').disabled = false; $('go').textContent = 'Cek'; $('out').innerHTML = ''; $('err').textContent = 'Koneksi bermasalah. Coba lagi.'; });
  }
  $('go').onclick = cek; $('ig').onkeydown = function (e) { if (e.key === 'Enter') cek(); };
  var m = /[?&]ig=([^&#]*)/.exec(location.search); if (m && decodeURIComponent(m[1])) { $('ig').value = decodeURIComponent(m[1]); cek(); }
})();
</script>
</body>
</html>
