<style>

  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--cream);color:var(--brown);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  body{min-height:100vh;position:relative;overflow-x:hidden}
  .blob{position:fixed;z-index:0;pointer-events:none;border-radius:58% 42% 63% 37% / 45% 55% 45% 55%}
  .b1{width:230px;height:200px;background:var(--yellow);top:-90px;left:-110px;transform:rotate(-12deg)}
  .b2{width:210px;height:230px;background:var(--coral);top:-110px;right:-120px;transform:rotate(20deg);opacity:.9}
  .b3{width:240px;height:220px;background:var(--coral);bottom:-150px;right:-130px;opacity:.85}

  .logo{font-family:var(--display);font-weight:700;color:var(--brown);font-size:26px;line-height:1;letter-spacing:.01em}
  .logo .dot{color:var(--coral)}

  .bar{max-width:520px;margin:14px auto 0;height:10px;background:var(--white);border:2px solid var(--line);border-radius:10px;overflow:hidden}

  main{max-width:560px;margin:0 auto;padding:16px 16px 130px}
  .section{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--coral);text-transform:uppercase;margin-bottom:6px}

  .opts.two .other{margin-left:0}
  @media (max-width:340px){.opts.two{grid-template-columns:1fr}}
  .opt{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:13px 15px;cursor:pointer;user-select:none;min-height:50px;font-weight:600;transition:transform .08s,border-color .15s,background .15s}
  .opt:active{transform:scale(.99)}
  .opt input{margin:2px 0 0;accent-color:var(--coral);width:20px;height:20px;flex:none}
  .opt.on{border-color:var(--coral);background:var(--yellow-l);box-shadow:3px 3px 0 var(--coral)}
  .opt.dis{opacity:.45;cursor:not-allowed}
  .opt small{font-weight:600}
  .grp{font-family:var(--display);font-size:14px;font-weight:600;color:var(--coral-d);margin:14px 0 2px}
  .other{margin:4px 0 0 32px}

  nav{position:fixed;left:0;right:0;bottom:0;background:rgba(251,241,225,.94);backdrop-filter:blur(6px);border-top:2px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
  nav div{max-width:560px;margin:0 auto;display:flex;gap:10px}

<style>

<script>
var SK_HTML = "  <div class=\"sk\">\n    <h2>1. Penyelenggara</h2>\n    <p>Giveaway ini diselenggarakan oleh MIL Gift Club melalui akun Instagram resmi <b>{IG}</b> (selanjutnya disebut \"Penyelenggara\"). Giveaway ini tidak disponsori, didukung, atau dikelola oleh Instagram maupun Meta.</p>\n\n    <h2>2. Periode</h2>\n    <ol>\n      <li>Giveaway berlangsung per periode. Tanggal berakhirnya periode dan tanggal pengumuman pemenang tercantum pada halaman survei, unggahan Instagram {IG}, dan kotak di bagian atas halaman ini.</li>\n      <li>Jawaban survei diikutsertakan dalam periode sesuai waktu jawaban diterima oleh sistem (Waktu Indonesia Barat).</li>\n      <li>Jawaban yang masuk setelah survei ditutup tidak diikutsertakan dalam pengundian.</li>\n    </ol>\n\n    <h2>3. Peserta</h2>\n    <ol>\n      <li>Berdomisili di Indonesia dan berusia minimal 18 tahun.</li>\n      <li>Memiliki akun Instagram aktif dan nomor WhatsApp aktif milik sendiri.</li>\n      <li>Tim pengelola MIL Gift Club beserta keluarga inti tidak diperkenankan mengikuti giveaway ini.</li>\n    </ol>\n\n    <h2>4. Cara Mengikuti</h2>\n    <ol>\n      <li>Mengisi survei secara lengkap dan jujur melalui tautan resmi yang dibagikan oleh {IG}.</li>\n      <li>Mengikuti (<i>follow</i>) akun Instagram {IG}.</li>\n      <li>Menyukai (<i>like</i>) unggahan giveaway.</li>\n      <li>Menulis komentar pada unggahan giveaway dengan menandai (<i>tag</i>) minimal {MINTAG} teman, yaitu akun berbeda milik orang sungguhan dan bukan akun Penyelenggara.</li>\n      <li>Membagikan unggahan giveaway ke Instagram Story dan menandai {IG}.</li>\n    </ol>\n    <p>Username Instagram yang ditulis di survei harus sama persis dengan akun yang menulis komentar. Akun Instagram tidak boleh dikunci (<i>private</i>) sejak mengikuti giveaway hingga pemenang diumumkan, agar keikutsertaan dapat diverifikasi. Peserta dapat memeriksa status keikutsertaannya di halaman <a href=\"{CEK}\" target=\"_blank\" rel=\"noopener\">Cek Status Giveaway</a>.</p>\n\n    <h2>5. Jawaban yang Sah</h2>\n    <p>Jawaban survei dinyatakan tidak sah dan tidak diikutsertakan dalam pengundian apabila:</p>\n    <ol>\n      <li>Tidak lolos pertanyaan pengecekan perhatian di dalam survei.</li>\n      <li>Diisi dalam waktu yang terlalu singkat sehingga dinilai tidak wajar.</li>\n      <li>Merupakan isian kedua atau berikutnya pada survei yang sama dengan nomor WhatsApp atau akun Instagram yang sama. Hanya jawaban pertama yang dihitung.</li>\n      <li>Menggunakan data yang tidak benar atau milik orang lain.</li>\n      <li>Berasal dari akun yang sedang diblokir atau ditangguhkan (<i>suspend</i>).</li>\n    </ol>\n    <p>Akun dengan jawaban yang tidak sah karena diisi asal-asalan dapat diblokir dari survei dan giveaway berikutnya. Permohonan pembukaan akses dapat dikirim ke <a href=\"mailto:{EMAIL}\">{EMAIL}</a>. Pelanggaran setelah akses dibuka akan dikenai penangguhan selama {SUSP} bulan.</p>\n\n    <h2>6. Kupon dan Kesempatan Menang</h2>\n    <ol>\n      <li>Setiap survei MIL Gift Club yang diisi dengan jawaban sah dalam suatu periode bernilai 1 (satu) kupon undian. Makin banyak survei berbeda yang diisi, makin banyak kupon yang dimiliki dan makin besar peluang menang.</li>\n      <li>Setiap survei hanya dapat diisi satu kali per orang. Isian ulang pada survei yang sama tidak menambah kupon.</li>\n      <li>Peserta diidentifikasi melalui nomor WhatsApp. Kupon yang diperoleh dengan beberapa akun atau nomor milik orang yang sama dapat dibatalkan.</li>\n      <li>Jumlah kupon dapat diperiksa di halaman <a href=\"{CEK}\" target=\"_blank\" rel=\"noopener\">Cek Status Giveaway</a>.</li>\n      <li>Setiap orang hanya dapat memenangkan satu hadiah dalam satu periode.</li>\n    </ol>\n\n    <h2>7. Pengundian dan Verifikasi</h2>\n    <ol>\n      <li>Pemenang dipilih secara acak oleh sistem dari peserta yang jawabannya sah dan telah memenuhi syarat komentar serta <i>tag</i> teman, dengan peluang sebanding jumlah kupon yang dimiliki.</li>\n      <li>Syarat <i>follow</i>, <i>like</i>, dan membagikan ke Instagram Story diverifikasi oleh Penyelenggara saat pemenang dihubungi. Pemenang wajib dapat menunjukkan bukti, misalnya tangkapan layar Instagram Story, apabila diminta.</li>\n      <li>Pemenang yang tidak memenuhi salah satu syarat dinyatakan gugur dan digantikan melalui pengundian ulang.</li>\n      <li>Keputusan Penyelenggara bersifat final dan tidak dapat diganggu gugat.</li>\n    </ol>\n\n    <h2>8. Pengumuman dan Klaim Hadiah</h2>\n    <ol>\n      <li>Pemenang diumumkan melalui akun Instagram {IG} pada tanggal yang tercantum.</li>\n      <li>Pemenang dihubungi melalui WhatsApp ke nomor yang diisi di survei.</li>\n      <li>Pemenang wajib membalas dan melengkapi data pengiriman hadiah paling lambat 3 x 24 jam sejak dihubungi. Apabila melewati batas waktu tersebut, pemenang dinyatakan gugur dan hadiah dialihkan melalui pengundian ulang.</li>\n    </ol>\n\n    <h2>9. Hadiah</h2>\n    <ol>\n      <li>Hadiah sesuai dengan yang tercantum pada halaman survei dan unggahan giveaway periode terkait.</li>\n      <li>Hadiah tidak dapat ditukar dengan uang tunai atau hadiah lain dan tidak dapat dipindahtangankan.</li>\n      <li>Hadiah barang dikirim ke alamat di wilayah Indonesia dengan biaya pengiriman ditanggung Penyelenggara. Hadiah saldo dompet digital dikirim ke akun atas nama pemenang.</li>\n      <li>Hadiah dikirim paling lambat 14 hari kerja setelah data pemenang lengkap.</li>\n      <li>Pajak hadiah sesuai ketentuan yang berlaku ditanggung oleh Penyelenggara.</li>\n      <li>Penyelenggara tidak bertanggung jawab atas keterlambatan atau kegagalan pengiriman akibat data yang tidak benar atau tidak lengkap dari pemenang.</li>\n    </ol>\n  </div>\n\n  <div class=\"warn\"><b>⚠️ Waspada penipuan.</b> Penyelenggara <b>tidak pernah</b> meminta biaya apa pun, transfer dana, kode OTP, PIN, maupun kata sandi dalam bentuk apa pun. Pengumuman pemenang hanya dilakukan melalui akun Instagram resmi {IG}. Pihak lain yang mengatasnamakan MIL Gift Club dan meminta hal tersebut bukan berasal dari Penyelenggara.</div>\n\n  <div class=\"sk\">\n    <h2>10. Data Pribadi</h2>\n    <ol>\n      <li>Data yang dikumpulkan melalui survei digunakan untuk keperluan riset, verifikasi keikutsertaan, dan menghubungi pemenang.</li>\n      <li>Hasil riset hanya disajikan dalam bentuk gabungan (agregat). Nomor WhatsApp dan username Instagram tidak ditampilkan dalam laporan riset dan tidak diperjualbelikan kepada pihak mana pun.</li>\n      <li>Data pribadi dikelola sesuai Undang-Undang Nomor 27 Tahun 2022 tentang Pelindungan Data Pribadi. Peserta dapat mengajukan permintaan akses, perbaikan, atau penghapusan data melalui <a href=\"mailto:{EMAIL}\">{EMAIL}</a>.</li>\n      <li>Username Instagram pemenang dapat diumumkan secara publik melalui akun Instagram {IG}.</li>\n    </ol>\n\n    <h2>11. Ketentuan Lain</h2>\n    <ol>\n      <li>Penyelenggara berhak mendiskualifikasi peserta yang terindikasi melakukan kecurangan, antara lain menggunakan akun palsu, beberapa akun sekaligus, atau program otomatis (<i>bot</i>).</li>\n      <li>Penyelenggara berhak mengubah Syarat &amp; Ketentuan ini sewaktu-waktu. Perubahan berlaku sejak diumumkan pada halaman ini.</li>\n    </ol>\n  </div>\n";
(function () {

  function api(fn, args) { return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) }).then(function (r) { return r.text(); }).then(function (t) { var j = JSON.parse(t); if (!j.ok) throw new Error(j.error || 'gagal'); return j.data; }); }
  var SRC = qs('src') || qs('utm_source') || 'langsung', CFG = {}, ST = { step: 'o1', ok: null, ig: '' };

    var b = SK_HTML.replace(/\{IG\}/g, esc(IGH())).replace(/\{MINTAG\}/g, esc(CFG.minTag || 3)).replace(/\{SUSP\}/g, esc(CFG.suspendBulan || 6))
      .replace(/\{EMAIL\}/g, esc(CFG.emailAkses || 'milgiftclub@gmail.com')).replace(/\{CEK\}/g, 'cek/');
    return '<div class="skbox"><div class="skh">📜 Syarat &amp; Ketentuan Giveaway</div><div class="skc">' + b + '</div><div class="skf">Dengan memilih bersedia mengikuti survei, kamu dianggap telah membaca dan menyetujui Syarat &amp; Ketentuan di atas.</div></div>';
  }
  function promo() {
    var r = '', hd = CFG.hadiah || [];
    if (CFG.periodeLabel) r += '<div class="pr-l">' + esc(CFG.periodeLabel) + '</div>';
    if (CFG.hadiahUtama) r += '<div class="pr-u"><span>🎁 Hadiah utama</span><b>' + esc(CFG.hadiahUtama) + '</b></div>';
    if (hd.length) r += '<div class="pr-s">Hadiah lainnya</div><ul>' + hd.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    if (CFG.periode) r += '<div class="pr-r"><span>📅 Periode Giveaway</span><b>' + esc(CFG.periode) + '</b></div>';
    if (CFG.announce) r += '<div class="pr-r"><span>🏆 Pengumuman Pemenang</span><b>' + esc(CFG.announce) + '</b></div>';
    return r ? '<div class="promo">' + r + '</div>' : '';
  }
  function render() {
    save(); window.scrollTo(0, 0); bb.style.visibility = ST.step === 'o1' ? 'hidden' : 'visible'; nb.style.display = ST.step === 'list' ? 'none' : ''; bb.textContent = ST.step === 'list' ? 'Ganti akun' : 'Kembali';
    if (ST.step === 'o1') {
      nb.textContent = 'Mulai';
      app.innerHTML = '<div class="section">Selamat datang</div>' + promo() +
        '<p class="intro">Terima kasih sudah mau berbagi pengalaman belanja online kamu. Setelah setuju, kamu bisa memilih survei yang ingin diisi. <b>Setiap survei yang diisi valid = 1 kupon undian</b>, jadi makin banyak survei, makin besar peluang menang.</p>' +
        '<h1>Apakah Anda bersedia mengikuti survei ini?</h1>' + skBox() + '<div id="body"><div class="opts">' +
        ['Ya, saya setuju dan bersedia mengikuti survei', 'Tidak bersedia'].map(function (t, i) { return '<label class="opt' + (ST.ok === (i === 0) ? ' on' : '') + '" data-i="' + i + '"><input type="radio" name="o1"' + (ST.ok === (i === 0) ? ' checked' : '') + '><span>' + t + '</span></label>'; }).join('') + '</div></div><div class="err" id="err"></div>';
      [].forEach.call(app.querySelectorAll('label.opt'), function (l) { l.onclick = function (e) { e.preventDefault(); ST.ok = l.dataset.i === '0'; [].forEach.call(app.querySelectorAll('label.opt'), function (x) { x.classList.toggle('on', x === l); x.querySelector('input').checked = x === l; }); $('err').textContent = ''; }; });
    } else if (ST.step === 'ig') {
      nb.textContent = 'Lanjut';
      app.innerHTML = '<div class="section">Akun kamu</div><h1>Tuliskan username Instagram Anda</h1><p class="hint">Dipakai untuk melihat survei mana yang sudah kamu isi, menghitung kupon, dan verifikasi giveaway.</p>' +
        '<div id="body"><input type="text" id="igv" placeholder="@usernamekamu" autocomplete="off" value="' + esc(ST.ig) + '"></div><div class="err" id="err"></div><div class="wait" id="wait"></div>';
      $('igv').onkeydown = function (e) { if (e.key === 'Enter') next(); };
    } else if (ST.step === 'bye') {
      nb.style.display = 'none'; bb.style.visibility = 'visible';
      app.innerHTML = '<div class="section">Terima kasih</div><h1>Tidak apa-apa 😊</h1><p class="intro">Terima kasih sudah mampir. Kalau berubah pikiran, kamu bisa kembali kapan saja. Pantau Instagram ' + esc(IGH()) + ' untuk survei & giveaway berikutnya.</p>';
    } else list();
  }
  function list() {
    app.innerHTML = '<div class="section">Pilih survei</div><h1>Halo ' + esc(ST.ig) + '! Survei mana yang mau kamu isi?</h1><div class="wait on"><i></i><span>Memuat daftar survei…</span></div>';
    api('hubList', [ST.ig]).then(function (d) {
      if (d.blocked) { app.innerHTML = '<div class="section">Akun dibatasi</div><h1>Akun ' + esc(d.ig) + ' sedang ' + (d.blocked.state === 'suspend' ? 'disuspend' : 'diblokir') + '</h1><p class="intro">Karena riwayat jawaban yang tidak valid' + (d.blocked.until ? ', sampai ' + esc(d.blocked.until) : '') + '. Hubungi ' + esc(d.blocked.email) + ' untuk membuka akses.</p>'; return; }
      var todo = d.list.filter(function (x) { return !x.done; }).length;
      var h = '<div class="section">Pilih survei</div><h1>Halo ' + esc(d.ig) + '! Survei mana yang mau kamu isi?</h1>' +
        '<div class="kup"><div class="kn">🎟️ ' + d.kupon + '</div><div><b>Kupon undian kamu di ' + esc(d.periode || 'periode ini') + '</b><p>' + (todo ? 'Masih ada <b>' + todo + ' survei</b> yang bisa kamu isi untuk menambah kupon.' : 'Kamu sudah mengisi semua survei yang sedang dibuka. Terima kasih!') + '</p></div></div>';
      h += d.list.map(function (x) {
        var u = x.link + (x.link.indexOf('?') < 0 ? '?' : '&') + 'ig=' + encodeURIComponent(d.ig.replace(/^@/, '')) + '&ok=1&src=' + encodeURIComponent(SRC);
        return '<a class="sv' + (x.done ? ' done' : '') + '" href="' + esc(u) + '"><div class="t"><b>' + (x.done ? '✓ ' : '') + esc(x.name) + '</b><small>' + esc(x.desc) + '</small>' +
          '<div class="m">' + (x.done ? 'Sudah diisi' + (x.valid ? '' : ' · tidak valid') : '±' + x.est + ' menit · +1 kupon') + '</div></div><span class="go">' + (x.done ? '✓ Selesai' : 'Mulai →') + '</span></a>';
      }).join('') + (d.list.length ? '' : '<p class="intro">Belum ada survei yang dibuka. Pantau Instagram ' + esc(IGH()) + ' ya!</p>');
      h += '<p class="small">Bukan akun kamu? Klik "Ganti akun" di bawah. · <a href="cek/?ig=' + encodeURIComponent(d.ig.replace(/^@/, '')) + '">🔎 Cek status giveaway</a></p>';
      app.innerHTML = h;
    }, function () { app.innerHTML = '<div class="err">Koneksi bermasalah. <a href="#" onclick="location.reload();return false">Coba lagi</a></div>'; });
  }
  function next() {
    if (ST.step === 'o1') { if (ST.ok == null) { $('err').textContent = 'Pilih salah satu jawaban dulu ya.'; return; } ST.step = ST.ok ? 'ig' : 'bye'; return render(); }
    if (ST.step === 'ig') {
      var v = $('igv').value.trim(); if (!/^@?[A-Za-z0-9._]{1,30}$/.test(v)) { $('err').textContent = 'Format username Instagram belum sesuai (contoh: @namaanda).'; return; }
      ST.ig = '@' + v.replace(/^@/, ''); ST.step = 'list'; return render();
    }
  }
  nb.onclick = next;
  bb.onclick = function () { ST.step = ST.step === 'list' ? 'ig' : 'o1'; render(); };
  render();
  if (API) api('config', ['v1', SRC]).then(function (c) { CFG = c; if (ST.step === 'o1') render(); }, function () {});
})();
</script>
</body>
</html>
